<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Offline — Alisons</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0f;
        color: #f4f4f5;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main { max-width: 28rem; padding: 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: #a1a1aa; }
      button {
        background: #f4f4f5;
        color: #0b0b0f;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.5rem 0.9rem;
        font: inherit;
      }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Alisons needs a connection to load messages. Nothing in this chat is stored on this device for offline reading.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
